# ============================================================================
# Configuración del cliente de consola REST (TI.1.3)
# Conversor de Unidades - CLICON
# ============================================================================
# El cliente resuelve la URL base de la API en este orden de prioridad:
#   1. URL_BASE (opcional)  -> override completo del servidor/API
#   2. API_BASE (opcional)  -> override completo de la base de la API
#   3. SERVIDOR_IP + SERVIDOR_PUERTO + SERVIDOR_CONTEXTO + /api
# Si un override no termina en /api, el cliente lo agrega automáticamente.
# ============================================================================

# Host donde escucha el servidor REST
SERVIDOR_IP=localhost

# Puerto HTTP del servidor REST
SERVIDOR_PUERTO=8080

# Nombre del contexto (finalName del WAR) desplegado en el contenedor
SERVIDOR_CONTEXTO=WS_ConversionUnidades_Java_GR8

# Override completo de la base de la API (ej. http://mi-host:8080/WS_ConversionUnidades_Java_GR8/api)
# Si se define, tiene prioridad sobre SERVIDOR_*.
API_BASE=

# Override completo del servidor (ej. http://mi-host:8080/WS_ConversionUnidades_Java_GR8)
# Si se define, tiene prioridad sobre API_BASE.
URL_BASE=

# Credenciales de referencia del servidor (MONSTER / MONSTER9) - solo documentación,
# el cliente siempre las solicita por consola.
