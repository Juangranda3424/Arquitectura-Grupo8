<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">EurekaBank · GR8</title>
    <link rel="stylesheet" href="/css/eureka.css">
</head>
<body>
    <div id="navbar-container"></div>
    <div class="container">
        <div id="main-content"></div>
    </div>
    <div id="modal-container"></div>
    <script>
        // Carga la barra superior cuando el usuario está autenticado
        function loadNavbar() {
            const navbarContainer = document.getElementById('navbar-container');
            const username = sessionStorage.getItem('username');
            if (username) {
                navbarContainer.innerHTML = `
                    <nav class="navbar">
                        <a href="/home" class="navbar-brand">
                            <svg class="logo-mark" viewBox="0 0 48 48" role="img" aria-label="EurekaBank">
                                <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="#0FA3B1" stroke="#F2A541" stroke-width="3"/>
                                <path d="M17 13h16v5H22v4h10v5H22v6h11v5H17z" fill="#FFFFFF"/>
                            </svg>
                            <span class="brand-text">
                                <span class="brand-name">EurekaBank</span>
                                <span class="brand-sub">Grupo 8 · Arquitectura de Software</span>
                            </span>
                        </a>
                        <div class="navbar-user">
                            <span>Usuario: <span class="user-name">${username}</span></span>
                            <a href="/logout" class="btn-logout">Salir</a>
                        </div>
                    </nav>
                `;

                // Manejar el logout
                const logoutLink = navbarContainer.querySelector('.btn-logout');
                logoutLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    sessionStorage.removeItem('username');
                    window.location.href = '/login';
                });
            } else {
                navbarContainer.innerHTML = '';
            }
        }

        // Cargar navbar al inicio
        loadNavbar();
    </script>
</body>
</html>
