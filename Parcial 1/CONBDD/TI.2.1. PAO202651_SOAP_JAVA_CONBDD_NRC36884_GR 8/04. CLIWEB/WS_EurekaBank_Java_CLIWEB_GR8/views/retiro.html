<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro - EurekaBank · GR8</title>
    <link rel="stylesheet" href="/css/eureka.css">
</head>
<body>
    <nav class="navbar">
        <a href="/home" class="navbar-brand">
            <svg class="logo-mark" viewBox="0 0 48 48" role="img" aria-label="EurekaBank">
                <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="#0FA3B1" stroke="#F2A541" stroke-width="3"/>
                <path d="M17 13h16v5H22v4h10v5H22v6h11v5H17z" fill="#FFFFFF"/>
            </svg>
            <span class="brand-text">
                <span class="brand-name">EurekaBank</span>
                <span class="brand-sub">Grupo 8 · Arquitectura de Software</span>
            </span>
        </a>
        <div class="navbar-user">
            <span>Usuario: <span class="user-name" id="username-display"></span></span>
            <a href="#" id="logout-link" class="btn-logout">Salir</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="page-head">
                <p class="page-eyebrow">Operación</p>
                <h1 class="page-title">Realizar retiro</h1>
                <p class="page-help">Retire un monto disponible de la cuenta indicada.</p>
            </div>

            <div id="error-message" class="alert alert-danger" style="display: none;">
                <span id="error-text"></span>
            </div>

            <div id="success-message" class="alert alert-success" style="display: none;">
                <span id="success-text"></span>
            </div>

            <form id="retiroForm" class="retiro-form">
                <div class="form-group">
                    <label class="form-label" for="cuenta">Número de cuenta</label>
                    <input type="text" id="cuenta" name="cuenta" class="form-control"
                           placeholder="Ingrese el número de cuenta" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="monto">Monto a retirar</label>
                    <input type="number" id="monto" name="monto" class="form-control"
                           placeholder="Ingrese el monto a retirar" step="0.01" min="0.01" required>
                </div>

                <button type="submit" class="btn btn-primary">Realizar retiro</button>
            </form>

            <div class="form-actions">
                <a href="/home" class="btn btn-secondary">Volver al menú</a>
            </div>
        </div>
    </div>

    <script>
        // Verificar autenticación
        const username = sessionStorage.getItem('username');
        if (!username) {
            window.location.href = '/login';
        } else {
            document.getElementById('username-display').textContent = username;
        }

        // Manejar logout
        document.getElementById('logout-link').addEventListener('click', (e) => {
            e.preventDefault();
            sessionStorage.removeItem('username');
            window.location.href = '/login';
        });
    </script>
    <script type="module" src="/controller/retiro.js"></script>
</body>
</html>
