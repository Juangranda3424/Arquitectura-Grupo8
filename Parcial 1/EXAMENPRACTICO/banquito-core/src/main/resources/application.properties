spring.application.name=banquito-core
server.port=8080

# PostgreSQL started by ../docker-compose.yml; override with DB_URL / DB_USER / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banquito}
spring.datasource.username=${DB_USER:gr8}
spring.datasource.password=${DB_PASSWORD:gr8pass}

# Flyway owns the schema (db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# Credit module business parameters.
banquito.credito.porcentaje-monto-maximo=0.35
banquito.credito.multiplicador-monto-maximo=6
banquito.credito.tasa-interes-anual=16.50
banquito.credito.cuotas-minimas=3
banquito.credito.cuotas-maximas=18

# The retailer web app calls this API from its server side; CORS kept for browser tools.
banquito.cors.allowed-origins=http://localhost:3000
