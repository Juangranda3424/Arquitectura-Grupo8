<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/default.html}">
<head>
    <title>Autentificación</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="auth-container">
            <div class="auth-box">
                <img src="/assets/images/monster_logo.png" alt="monster" class="auth-img shadow-sm">

                <div th:if="${error}" class="alert alert-danger mb-4 w-100 border-0 shadow-sm" role="alert">
                    <p class="m-0 w-100 text-center" th:text="${error}">Error</p>
                </div>

                <form class="auth-form" action="/login" method="post">
                    <div class="form-group mb-3">
                        <label for="username" class="form-label fw-medium">Username</label>
                        <input type="text" name="username" class="form-control" id="username" placeholder="username" value="monster">
                    </div>
                    <div class="form-group mb-3">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <input type="password" name="password" class="form-control" id="password" placeholder="password" value="monster9">
                    </div>
                    <div class="form-group mb-4">
                        <label for="serverIp" class="form-label fw-medium">Server IP</label>
                        <input type="text" name="serverIp" class="form-control" id="serverIp" placeholder="localhost" value="localhost">
                    </div>
                    <div class="d-grid">
                        <input type="submit" value="Ingresar" class="btn btn-primary py-2">
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
